replicaCount: 1

image:
  repository: rate-limiter-app # We will use the image built by Docker Compose
  pullPolicy: Never # Use local image
  tag: "latest"

service:
  type: NodePort
  port: 8080

env:
  redisHost: "rate-limiter-redis-master"
  redisPort: "6379"

# We use the Bitnami Redis chart as a dependency
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  image:
    tag: "7.2"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

httpRoute:
  enabled: false
  className: ""
  hostnames: []
  parentRefs: []
  rules: []